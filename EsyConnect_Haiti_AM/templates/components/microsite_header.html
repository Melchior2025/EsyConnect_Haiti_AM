{% load i18n %}

<!-- Microsite Header -->
<header class="bg-white border-b border-gray-200 fixed top-0 left-0 right-0 z-[100] shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-3">
        <div class="flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-esy-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-md">
                    <i class="fas fa-store text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black text-esy-dark">EsyConnect</h1>
                    <p class="text-xs text-gray-500 font-bold">{% trans "Haïti" %}</p>
                </div>
            </a>
            <div class="flex items-center gap-3">
                <a href="/" class="flex items-center gap-2 px-4 py-2 bg-esy-blue-600 text-white rounded-xl font-bold text-sm hover:bg-esy-blue-700 transition shadow-md">
                    <i class="fas fa-home"></i>
                    {% trans "Accueil" %}
                </a>
            </div>
        </div>
    </div>
</header>

<!-- Spacer for fixed header -->
<div class="h-16"></div>
