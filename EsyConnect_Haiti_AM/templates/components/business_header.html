{% load i18n %}
<header class="sticky top-0 z-50 bg-white border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
            <!-- Back to Home & Business Logo -->
            <div class="flex-shrink-0 flex items-center gap-4">
                <a href="{% url 'business:home' %}" class="flex items-center justify-center w-10 h-10 bg-gray-100 rounded-xl hover:bg-gray-200 transition">
                    <i class="fas fa-arrow-left text-gray-700"></i>
                </a>
                <a href="{% url 'business:detail' business.id %}" class="flex items-center space-x-3 group">
                    {% if business.logo %}
                        <img src="{{ business.logo.url }}" class="w-10 h-10 rounded-xl object-cover shadow-lg" alt="{{ business.name }}">
                    {% else %}
                        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                            <i class="fas fa-store text-white"></i>
                        </div>
                    {% endif %}
                    <span class="text-xl font-black tracking-tight text-gray-900">{{ business.name }}</span>
                </a>
            </div>

            <!-- Business Navigation -->
            <nav class="hidden lg:flex items-center space-x-6">
                <a href="{% url 'business:detail' business.id %}#about" class="text-sm font-bold text-gray-700 hover:text-blue-600 transition">{% trans "À propos" %}</a>
                <a href="{% url 'business:detail' business.id %}#photos" class="text-sm font-bold text-gray-700 hover:text-blue-600 transition">{% trans "Photos" %}</a>
                <a href="{% url 'business:detail' business.id %}#reviews" class="text-sm font-bold text-gray-700 hover:text-blue-600 transition">{% trans "Avis" %}</a>
                <a href="{% url 'business:detail' business.id %}#contact" class="text-sm font-bold text-gray-700 hover:text-blue-600 transition">{% trans "Contact" %}</a>
                
                {% if business.phone %}
                <a href="tel:{{ business.phone }}" class="flex items-center gap-2 px-4 py-2 bg-green-500 text-white rounded-xl font-bold hover:bg-green-600 transition">
                    <i class="fas fa-phone"></i> {% trans "Appeler" %}
                </a>
                {% endif %}
            </nav>

            <!-- Mobile Menu Button -->
            <button class="lg:hidden p-2 rounded-lg hover:bg-gray-100 transition">
                <i class="fas fa-bars text-gray-700"></i>
            </button>
        </div>
    </div>
</header>
