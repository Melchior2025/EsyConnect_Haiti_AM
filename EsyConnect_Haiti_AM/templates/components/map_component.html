{% load i18n %}
<!-- Interactive Map Component - Professional Design -->
<div class="relative">
    <div id="map-{{ business.id|default:'main' }}" class="h-[500px] bg-gradient-to-br from-gray-100 to-gray-200 rounded-3xl shadow-2xl overflow-hidden border-4 border-white"></div>
    
    <!-- Map Controls Overlay -->
    <div class="absolute top-4 right-4 z-[1000] flex flex-col gap-2">
        <button onclick="zoomIn()" class="w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center text-blue-600 hover:bg-blue-600 hover:text-white transition-all transform hover:scale-110">
            <i class="fas fa-plus"></i>
        </button>
        <button onclick="zoomOut()" class="w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center text-blue-600 hover:bg-blue-600 hover:text-white transition-all transform hover:scale-110">
            <i class="fas fa-minus"></i>
        </button>
        <button onclick="resetMap()" class="w-12 h-12 bg-white rounded-xl shadow-lg flex items-center justify-center text-blue-600 hover:bg-blue-600 hover:text-white transition-all transform hover:scale-110">
            <i class="fas fa-crosshairs"></i>
        </button>
    </div>
    
    <!-- Map Info Badge -->
    <div class="absolute bottom-4 left-4 z-[1000] bg-white/95 backdrop-blur-sm rounded-2xl shadow-xl px-6 py-4 border border-gray-100">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                <i class="fas fa-map-marked-alt text-white"></i>
            </div>
            <div>
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">{% trans "Localisation" %}</p>
                <p class="text-sm font-bold text-gray-900">{{ business.name|default:"EsyConnect" }}</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Initialize Leaflet Map for Business - Professional Design
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof L !== 'undefined') {
            const mapId = 'map-{{ business.id|default:"main" }}';
            const mapElement = document.getElementById(mapId);
            
            if (mapElement) {
                // Initialize map with professional styling
                const map = L.map(mapId, {
                    zoomControl: false,
                    scrollWheelZoom: true
                }).setView([{{ business.latitude|default:"19.757" }}, {{ business.longitude|default:"-72.204" }}], 14);
                
                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19,
                    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, HERE, Garmin, USGS, NGA, EPA, USDA, NPS'
                }).addTo(map);
                
                // Custom professional marker with animation
                const customIcon = L.divIcon({
                    html: `
                        <div class="relative">
                            <div class="absolute -inset-3 bg-blue-600 rounded-full opacity-20 animate-ping"></div>
                            <div class="relative bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-2xl w-16 h-16 flex items-center justify-center shadow-2xl border-4 border-white transform hover:scale-110 transition-transform duration-300">
                                <i class="fas fa-store text-xl"></i>
                            </div>
                            <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-blue-600 rotate-45 border-4 border-white"></div>
                        </div>
                    `,
                    iconSize: [64, 64],
                    iconAnchor: [32, 32],
                    popupAnchor: [0, -32]
                });
                
                const marker = L.marker([{{ business.latitude|default:"19.7594" }}, {{ business.longitude|default:"-72.2497" }}], {icon: customIcon}).addTo(map);
                
                // Professional popup content with enhanced styling
                const popupContent = `
                    <div class="min-w-[300px]">
                        <div class="bg-gradient-to-r from-blue-600 to-blue-700 text-white p-4 rounded-t-2xl">
                            <h4 class="font-black text-xl mb-1">{{ business.name }}</h4>
                            <p class="text-blue-200 text-sm font-medium">{{ business.category.name|default:"Business" }}</p>
                        </div>
                        <div class="bg-white p-4 rounded-b-2xl shadow-xl">
                            {% if business.phone %}
                            <div class="flex items-center gap-3 mb-3 pb-3 border-b border-gray-100">
                                <div class="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center">
                                    <i class="fas fa-phone text-green-600"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-gray-400 uppercase">{% trans "Téléphone" %}</p>
                                    <p class="text-sm font-bold text-gray-900">{{ business.phone }}</p>
                                </div>
                            </div>
                            {% endif %}
                            {% if business.address %}
                            <div class="flex items-center gap-3 mb-3 pb-3 border-b border-gray-100">
                                <div class="w-10 h-10 bg-blue-100 rounded-xl flex items-center justify-center">
                                    <i class="fas fa-map-marker-alt text-blue-600"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-gray-400 uppercase">{% trans "Adresse" %}</p>
                                    <p class="text-sm font-bold text-gray-900">{{ business.address }}</p>
                                </div>
                            </div>
                            {% endif %}
                            {% if business.email %}
                            <div class="flex items-center gap-3 mb-4">
                                <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center">
                                    <i class="fas fa-envelope text-purple-600"></i>
                                </div>
                                <div>
                                    <p class="text-xs font-bold text-gray-400 uppercase">{% trans "Email" %}</p>
                                    <p class="text-sm font-bold text-gray-900">{{ business.email }}</p>
                                </div>
                            </div>
                            {% endif %}
                            <a href="{% url 'business:business_detail' business.id %}" class="block w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white text-center py-3 rounded-xl font-bold hover:from-blue-700 hover:to-blue-800 transition-all transform hover:scale-105 shadow-lg">
                                <i class="fas fa-arrow-right mr-2"></i>{% trans "Voir le profil complet" %}
                            </a>
                        </div>
                    </div>
                `;
                
                marker.bindPopup(popupContent, {
                    maxWidth: 400,
                    className: 'custom-popup'
                });
                
                // Add zoom controls
                window.zoomIn = function() {
                    map.zoomIn();
                };
                
                window.zoomOut = function() {
                    map.zoomOut();
                };
                
                window.resetMap = function() {
                    map.setView([{{ business.latitude|default:"19.7594" }}, {{ business.longitude|default:"-72.2497" }}], 15);
                };
            }
        }
    });
</script>

<style>
    .custom-popup .leaflet-popup-content-wrapper {
        border-radius: 1rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        padding: 0;
        overflow: hidden;
    }
    
    .custom-popup .leaflet-popup-content {
        margin: 0;
    }
    
    .custom-popup .leaflet-popup-tip {
        background: white;
    }
</style>
